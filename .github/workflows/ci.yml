name: Check build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:handling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handling-report
          path: artifacts/handling/
          retention-days: 7
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
